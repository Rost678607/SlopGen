[project]
name = "slopgen"
version = "0.1.0"
description = "Modular short-form video factory: idea -> script -> TTS -> footage -> ffmpeg assembly -> metadata -> publish"
requires-python = ">=3.12"
dependencies = [
    "textual>=0.86",
    "typer>=0.12",
    "pydantic>=2.7",
    "httpx>=0.27",
    "edge-tts>=6.1",
    "python-dotenv>=1.0",
    "tomli-w>=1.0",
    "ddgs>=6.0",
    "google-api-python-client>=2.130",
    "google-auth-oauthlib>=1.2",
    "gradio_client>=1.3",
]

# Optional engines. Everything the pipeline needs by default is above; these are
# per-engine SDKs, and only the engine that needs one has to have it. Weights and
# the packages that load them are NOT here — `slopgen models install` fetches those,
# because a 2.3 GiB model has no business in a dependency list (see slopgen/models/).
[project.optional-dependencies]
azure = ["azure-cognitiveservices-speech>=1.40"]

[project.scripts]
slopgen = "slopgen.cli.app:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
