plugins {
    id "fabric-loom" version "${loom_version}"
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

repositories {
    exclusiveContent {
        forRepository { maven { name = "Modrinth"; url = "https://api.modrinth.com/maven" } }
        filter { includeGroup "maven.modrinth" }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Driven, never bundled: both must be installed next to slopcam.
    modCompileOnly "maven.modrinth:flashback:${project.flashback_version}"
    modCompileOnly "maven.modrinth:easy-npc-core:${project.easy_npc_version}"
}

processResources {
    inputs.property "version", project.version
    inputs.property "flashback_version", project.flashback_version
    inputs.property "easy_npc_version", project.easy_npc_version
    filesMatching("fabric.mod.json") {
        expand "version": project.version,
               "flashback_version": project.flashback_version,
               "easy_npc_version": project.easy_npc_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = "UTF-8"
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}
