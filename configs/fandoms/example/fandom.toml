tone = "Спокойный, бытовой, без пафоса. Рассказчик — свой человек на станции: говорит короткими фразами, называет вещи местными словами и объясняет их мимоходом. Мера всему — вес, вёрсты и дни. Тайны подаются как рабочая неувязка, а не как чудо."
