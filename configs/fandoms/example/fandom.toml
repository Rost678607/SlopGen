canon = "WHAT THIS WORLD IS:\n  Перевал Тихая Гряда — почтовая станция на седловине между долинами Подгорья и Смородина. Через неё идут все сумки между долинами: скорый красный мешок и тихая почта, которая отстаивается. Смысл станции — сумки, верхняя тропа, перекличка девяти колоколов и тропная книга.\n\nHOW PEOPLE HERE TALK:\n  Говорят коротко и по-деловому, с точными числами и сроками: «214, лист 9, ветрено», «четыреста шестьдесят раз». Под усталость, опасность и необъяснимое подкладывают поговорки и отговорки: «Сумка дойдёт», «Не тороплю, я тихую несу», «Плата уплачена».\n\nHOW THE WORLD WORKS — never break these:\n  - Почта между Подгорьем и Смородином идёт только через станцию; обход низом занимает одиннадцать дней.\n  - Скорый мешок не вскрывают на станции никогда, даже чтобы досушить, и он не отстаивается никогда; за задержку на ночь смотрителя снимают.\n  - Тихая почта лежит на станции столько, сколько нужно, и уходит попутно.\n  - Плата считается на лоты: тихое письмо — пятак за лот, скорое — двугривенный за лот и вперёд.\n  - Посылка тяжелее сорока лотов идёт только летним ходом, на муле.\n  - Семена, книги и лекарство возят за полцены — так заведено с восемьдесят восьмого.\n  - В сумку-двойчатку входит триста двадцать лотов, и больше в неё не кладут, как бы ни просили.\n  - Двойчатку нельзя ставить на землю печатью вниз и нельзя нести на одном плече дольше одного лежака.\n  - Зимой переносчик выходит парой, никогда в одиночку, и несёт двойчатку, три дня еды, снеговую лопатку, шило, моток пеньки и лампу-жировку; свечей на верхнюю тропу не берут.\n  - Дневной перегон — от лежака до лежака, четыре-шесть часов; ночевать между лежаками запрещено; если пара не дошла к темноте, она поворачивает назад, и это не считается позором.\n  - Считать нужно вешки, а не шаги.\n  - Каждый вечер в сумерки звонят девять колоколов с юга на север: один удар — «всё цело», два — «жди, задержка», три — «идёт человек»; если колокол не отвечает трижды подряд, к нему идут.\n  - В немой день никто никуда не выходит.\n  - Писать в тропную книгу может только смотритель; читать — любой, кто умеет.\n  - Сургучный день — первый четверг месяца; в этот день Сургучная палата опечатывает всё, что накопилось, и поднимает наверх.\n  - Сургуч на перевале свой, с толчёной охрой, поэтому здешняя печать бурая, а не красная.\n  - Найденное на тропе письмо поднимают и несут дальше молча; читать нельзя даже вслух себе.\n  - Мул, который лёг у вешечной, не пойдёт в тот день; спорить бесполезно.\n  - Письма под девятую вешку кладут в жестяной ящик; их забирают, и дважды в год появляется ответ тем же почерком, с полной платой в лотах.\n\nWHAT DOES NOT EXIST HERE — never put these on screen or in the mouth:\n  - Телеграфа через гряду нет и быть не может: столбы не держатся в осыпи.\n  - Другой дороги через гряду нет; обход низом занимает одиннадцать дней.\n  - Скорый мешок на станции не вскрывают никогда, даже чтобы досушить; задержать его на ночь нельзя — смотрителя снимают.\n  - Свечей на верхнюю тропу не берут: гаснут.\n  - В немой день никто никуда не выходит.\n  - Зимой по верхней тропе не ходят в одиночку, не ночуют между лежаками и не продолжают путь, если не успели к темноте, — поворачивают назад.\n  - Найденное на тропе письмо не читают даже вслух себе.\n  - Мул, лёгший у вешечной, не пойдёт в тот день; спорить с ним бесполезно.\n  - Двойчатку не ставят на землю печатью вниз и не несут на одном плече дольше одного лежака.\n  - Дом под девятой вешкой не существует как дом; есть только площадка, каменный столбик и жестяной ящик.\n  - Нет автомобилей, телефонной связи, электрического освещения, железных дорог; передвигаются пешком, на мулах, с лампами-жировками и печами.\n  - Письма под девятую вешку пишут и забирают, но имя адресата не значится ни в одной подгорной книге; Марта не называет, кто это делает.\n\nTHE WORLD'S OWN WORDS:\n  - щетинка — жёсткая нагорная трава, растёт выше леса.\n  - стланик — низкорослый горный кустарник, растёт наверху.\n  - вешка — крашенная охрой жердь в рост человека, метка тропы; их триста двенадцать, через каждые сорок шагов.\n  - вешечник — тот, кто правит вешки.\n  - лежак — каменная хижина с печью на верхней тропе.\n  - двойчатка (сумка-двойчатка) — холщовая сумка о двух отделениях: верхнее открытое тихое, нижнее прошито и опечатано скорое.\n  - жировка — плоский фонарь на бараньем сале, который не тухнет на ветру.\n  - перекличка — вечерний звон девяти колоколов вдоль гребня с юга на север; занимает около получаса.\n  - немой день — туман, в котором не слышно соседнего колокола; в такой день никто не выходит.\n  - отстой — время, которое почта лежит и ждёт; бывает погодный, весовой и приказный.\n  - перенос (зимний перенос) — зимняя доставка пешком по верхней тропе.\n  - летний ход — летняя доставка на мулах, низом через седловину, с апреля по октябрь.\n  - тихарь — человек, который возит только тихую почту и не берётся за скорое.\n  - Скорый мешок — красный опечатанный мешок; идёт в тот же день, каким бы ни был ветер; на станции его не вскрывают никогда.\n  - Тихая почта — всё остальное: письма без срока, посылки, книги из переплётной, семена, счета; лежит столько, сколько нужно, и уходит попутно.\n  - Сургучный день — первый четверг месяца, когда Сургучная палата опечатывает накопленное и поднимает наверх.\n  - Тропная книга — толстая тетрадь в кожаном переплёте; в неё пишут каждый переход; книгу заводят на четыре года, в холодной кладовой их лежит пятьдесят три.\n  - лот — вес небольшого яблока; единица платы и веса; в сумку-двойчатку входит триста двадцать лотов.\n\nWHO AND WHAT IS NAMED:\n  - Марта Ковжун — смотрительница станции, тринадцатый год; ведёт тропную книгу, решает, что пойдёт скорым, а что подождёт; её слово на перевале последнее; носит письма под девятую вешку сама и отвечает «Плата уплачена».\n  - Ефим Задорога — старший переносчик, ходит верхнюю тропу зимой; за девять лет прошёл её, по его счёту, четыреста шестьдесят раз.\n  - Захар Мельный — погонщик, третье поколение мулиего двора Мельных; знает каждую из двенадцати голов по храпу.\n  - Нюша Плетень — ученица-разборщица, взята на станцию в двести одиннадцатом; сортирует, штемпелюет, ведёт учёт лотов.\n  - Севастьян Гривка — вешечник, старшина артели; раз в год проходит все триста двенадцать вешек и красит их заново; говорит, что тропу на отрог можно восстановить за две недели вчетвером.\n  - Оксана Гривка — прабабка Севастьяна, первый смотритель, который умеет писать; завела тропную книгу в нынешнем виде в сто первом.\n\nPLACES:\n  - Перевал Тихая Гряда — почтовая станция на седловине между двумя долинами; смысл её существования — сумки.\n  - Почтовая станция — дом из плитняка, крыт двойным тёсом, придавлен камнями от ветра; внутри разборная, сушильня, спальня на шесть коек, кухня и холодная кладовая.\n  - Подгорье — южное село, четыреста дворов, ярмарка по вторникам, Сургучная палата.\n  - Смородино — северное село, поменьше, известно сушёной ягодой и единственной на две долины переплётной.\n  - Одинцы — три двора на северном отроге, выше всех; оттуда отвечает девятый колокол.\n  - Подгорная речка — река, в которую собираются южные ручьи.\n  - Смородная — река, в которую собираются северные ручьи.\n  - Седловина — перевал между долинами; на восемьсот саженей выше Подгорья.\n  - Верхняя тропа — идёт по самому гребню, где ветер сдувает снег; на ней пять лежаков.\n  - Лежак Мокрый — первый лежак; под ним сочится родник, зимой натёк льда в человеческий рост.\n  - Лежак Сухой — второй лежак; самый тёплый, здесь ночуют чаще всего.\n  - Лежак Собачий — третий лежак; назван по своре, что жила при нём восемьдесят лет назад.\n  - Лежак Слепой — четвёртый лежак; стоит в постоянном тумане, окна забиты наглухо.\n  - Лежак Двухтрубный — пятый лежак; единственный с двумя печами, последний перед спуском в Смородино.\n  - Девятая вешка — место, где нет дома; есть площадка, каменный столбик и жестяной ящик для писем.\n  - Девятый колокол — одинцовский колокол; с двести девятого молчит.\n  - Разборная — помещение станции, где сортируют почту.\n  - Сушильня — помещение станции, где сушат.\n  - Холодная кладовая — кладовая станции, куда складывают то, что не должно отсыреть; в ней лежат пятьдесят три тропные книги.\n  - Вешечная — сарай во дворе станции, где сушат и красят вешки.\n  - Мулий загон — загон на двенадцать голов.\n\nGROUPS:\n  - Сургучная палата — учреждение в Подгорье; в сургучный день опечатывает всё накопленное и поднимает наверх; с сто пятьдесят четвёртого использует охряный сургуч, дающий бурую печать.\n  - Артель вешечников — артель, старшина которой Севастьян Гривка; правит и красит вешки; починку тропы на отрог третий год откладывает на будущее лето.\n  - Мельные — семья погонщиков, третье поколение на мулием дворе.\n  - Задороги — семья переносчиков; в сто шестьдесят третьем пара Задорог повернула назад; из этой семьи Ефим Задорога.\n  - Семьи почтарей — семьи, из которых обычно выходят смотрители; Марта Ковжун — первая, кто пришёл не из них.\n  - Переплётная в Смородине — единственная на две долины переплётная; оттуда идут книги тихой почтой.\n\nWHAT HAPPENED, IN ORDER:\n  - 1, осень — Первый Мешок; дом ставят за сорок один день, до снега.\n  - 12 — ставят первую вешку; всего их тогда девяносто.\n  - 46 — строят лежаки Мокрый и Сухой; Верхняя тропа впервые проходится зимой целиком, за шесть дней.\n  - 63 — Мельные приводят на станцию первых мулов; до этого груз таскали на себе круглый год.\n  - 88 — Большой отстой: перевал закрыт пять месяцев подряд, с октября по март; ждут тысяча сто девять сумок; после этого вводят полцены на семена, книги и лекарство и достраивают три оставшихся лежака.\n  - 101 — заводят тропную книгу в нынешнем виде; первый смотритель, который умеет писать, — Оксана Гривка, прабабка Севастьяна.\n  - 129 — вешают перекличку: девять колоколов от Подгорья до Одинцов; первый общий звон — в ночь на равноденствие, слышали, говорят, в обеих долинах.\n  - 154 — Сургучная палата переходит на охряный сургуч; бурая печать становится знаком гряды.\n  - 163, февраль — под снегом складывается крыша Слепого лежака; никто не пострадал: пара Задорог повернула назад накануне, потому что не успевала к темноте; с тех пор поворот до темноты — правило, а не выбор.\n  - 171 — в разборной впервые находят письмо, адресованное «в дом под девятой вешкой»; дома там нет.\n  - 188, зима — из тропной книги вырван лист; что было в ту зиму, неизвестно.\n  - 202 — Марта Ковжун становится смотрительницей — четвёртой женщиной на этой должности и первой, кто пришёл не из семьи почтарей.\n  - 209, октябрь — девятый колокол, одинцовский, перестаёт отвечать на перекличку.\n  - 211 — на станцию берут ученицу, Нюшу Плетень; первый набор за девятнадцать лет.\n  - 214, апрель — в Собачьем лежаке под настилом находят сорок одну сумку тихой почты; печати целы; самое старое письмо в них датировано сто восемьдесят восьмым.\n  - К осени 214 разнесено двадцать девять сумок из найденных сорока одной."
