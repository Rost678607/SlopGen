# AI-drama, fully user-assisted: every shot is generated by hand. slopgen plans
# the shotlist and writes one prompt per shot; the run pauses at the footage
# stage and you fill the clips with `slopgen gather` (or by dropping shot_NN.mp4
# files into the run's manual/inbox/ folder), after which it resumes and
# assembles. Free with no API — you handle the daily limits by hopping services
# and accounts. Use for the 7-minute dramas while bootstrapping.
#
# Mix with automatic generators freely: e.g. a `manual` stage for hero shots and
# a `wan2.1` stage for filler. The manual shots gate first (the run pauses until
# they are all delivered), then the automatic ones generate.
name = "manual"

[[stages]]
model = "manual"
metric = "percent"
amount = 100.0
# You are making these clips by hand, so they can be far longer than a Space's ~5s
# — and one 10-second clip comfortably holds several scenes in a row. At 8s+ the
# writer describes each shot as a sequence ("wide THEN close-up THEN reaction")
# instead of one frozen framing. Fewer, longer clips = fewer generations per video.
clip_seconds = 10.0
